services:
    postgres:
        image: postgres:16
        container_name: mh-admin-db
        restart: unless-stopped
        environment:
            POSTGRES_DB: mh_admin
            POSTGRES_USER: mh_admin
            POSTGRES_PASSWORD: mh_admin_password
        ports:
            - "5432:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data

volumes:
    postgres-data:
